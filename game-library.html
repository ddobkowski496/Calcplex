<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071226"><title></title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#071226;--panel:#0e2250;--panel2:#13306b;--line:#1f3f85;--text:#eaf1ff;--muted:#9db6e8;--blue:#2f7bff;font-family:'Fredoka',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 85% -10%,#1d4fd0 0,transparent 40%),var(--bg);color:var(--text)}
.shell{max-width:1300px;margin:auto;padding:20px clamp(12px,3vw,34px) 48px}
.header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
.brand{font:14px/1.4 'Press Start 2P',monospace;color:#fff;letter-spacing:.02em}
.count{color:var(--muted);font-size:14px}
.player{background:var(--panel);border-radius:30px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:2px 6px 12px}
.player-title{font-weight:600;font-size:17px}
.control{font:inherit;font-weight:500;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:9px 20px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.control:active{transform:translateY(2px);box-shadow:none}
.note{display:none}.note.show{display:block;color:#ffe08a;font-size:13px;margin:0 6px 10px}
.player-tabs{display:flex;gap:8px;overflow:auto;padding:0 2px 10px}
.player-tabs:empty{display:none}
.player-tab{font:inherit;font-size:14px;border:0;border-radius:999px;background:var(--panel2);color:#cfe0ff;padding:8px 14px;white-space:nowrap;cursor:pointer}
.player-tab.active{background:#fff;color:#0e2250;font-weight:600}
.player-tab .close{margin-left:10px;opacity:.7}
.stage{height:min(66vh,720px);min-height:300px;position:relative;overflow:hidden;border-radius:22px;background:#000;box-shadow:inset 0 0 0 3px #000}
.stage iframe{display:block;width:100%;height:100%;border:0;background:#000}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font:12px 'Press Start 2P',monospace}
.empty strong{color:#6f9bff;font-weight:400}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:24px 0 16px}
.search{flex:1;min-width:180px;max-width:360px;font:inherit;background:var(--panel);color:#fff;border:2px solid transparent;border-radius:999px;padding:11px 18px;outline:none}
.search:focus{border-color:var(--blue)}
.filter{font:inherit;font-size:14px;border:0;border-radius:999px;background:var(--panel);color:#c4d6ff;padding:9px 16px;cursor:pointer}
.filter.active{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{text-align:left;font:inherit;border:0;border-radius:24px;background:var(--panel);color:var(--text);padding:10px 10px 14px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.card[hidden]{display:none}
.art{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:16/10;border-radius:16px;overflow:hidden;margin-bottom:10px}
.art .mark{font:16px 'Press Start 2P',monospace;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12px}
.art.has-logo{background:#fff!important}
.title{display:block;font-weight:600;font-size:15px;padding:0 6px}
.category{display:block;margin:3px 6px 0;color:var(--muted);font-size:12px}
@media(max-width:600px){.stage{height:52vh}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player{border-radius:24px}}
</style><script src="game-library.js" defer></script></head>
<body><main class="shell">
<header class="header"><div class="brand">CALCPLEX ARCADE</div><div class="count" id="count"></div></header>
<section class="player" aria-label="Game player">
<div class="player-head"><div class="player-title" id="playing">No game selected</div><div class="player-actions"><button id="fullscreen" class="control" type="button" hidden>Fullscreen</button></div></div>
<p class="note" id="gameNote"></p>
<div class="player-tabs" id="playerTabs"></div>
<div class="stage" id="stage"><div class="empty" id="empty"><div><strong>Pick a game</strong></div></div></div>
</section>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search" aria-label="Search games"><button class="filter active" data-category="All">All</button><button class="filter" data-category="Sports">Sports</button><button class="filter" data-category="Racing">Racing</button><button class="filter" data-category="Action">Action</button><button class="filter" data-category="Platformer">Platformer</button><button class="filter" data-category="Arcade">Arcade</button><button class="filter" data-category="Strategy">Strategy</button><button class="filter" data-category="Idle">Idle</button></div>
<section class="grid" id="games" aria-label="Games"></section>
</main></body></html>

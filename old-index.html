<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6f8">
<title>Calculator</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#18212b;background:#f4f6f8;--line:#d5dce2;--muted:#687783;--ink:#192632;--blue:#1969a8;--panel:#fff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1020px;margin:28px auto;padding:0 18px 48px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px}.top h1{font-size:21px;font-weight:650;margin:0}.status{color:var(--muted);font-size:12px}.modes{display:flex;gap:7px;margin:0 0 10px}.modes button,.key,.small{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;cursor:pointer}.modes button{padding:9px 15px}.modes button.active{background:#263c4b;color:white;border-color:#263c4b}.panel{background:var(--panel);border:1px solid #dce2e7;border-radius:12px;padding:20px;box-shadow:0 4px 18px #1424320a}.screen{width:100%;font:30px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;padding:15px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fbfcfd;outline:none}.screen:focus{border-color:#6fa3c8;box-shadow:0 0 0 3px #1b6ca514}.result{min-height:31px;margin:10px 5px 14px;text-align:right;color:#586975;font:18px ui-monospace,monospace;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.key{font-size:17px;min-height:52px}.key:hover,.small:hover{border-color:#80a8c4;background:#f4f9fc}.key.fn{background:#f0f4f6}.key.op{background:#eaf0f4}.key.eq{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}.graphbox{display:none;margin-top:16px}.graphbox.show{display:block}.graph-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.graph-controls label{font-size:13px}.graph-controls input{width:100px;padding:8px;border:1px solid var(--line);border-radius:6px}.graph-controls #graphExpr{width:210px}.small{padding:8px 11px}.graphbox canvas{display:block;width:100%;height:290px;border:1px solid var(--line);border-radius:8px;background:#fff}.hint{color:var(--muted);font-size:12px;margin:8px 0 0}.history{margin-top:14px;padding-top:12px;border-top:1px solid #edf0f2}.history h2{font-size:13px;font-weight:700;margin:0 0 7px}.history-list{display:grid;gap:4px;max-height:130px;overflow:auto}.history-row{display:flex;justify-content:space-between;gap:12px;padding:5px 2px;color:#53636e;font:12px ui-monospace,monospace;cursor:pointer}.history-row:hover{color:#172b3a}.account{margin:0 0 12px;padding:12px 15px;background:#fff;border:1px solid #dce2e7;border-radius:10px}.account summary{cursor:pointer;font-size:13px;font-weight:650;color:#263c4b}.account-form{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end;margin-top:12px}.account-form label{display:grid;gap:5px;color:var(--muted);font-size:11px}.account-form input{min-width:0;padding:9px;border:1px solid var(--line);border-radius:6px;font:13px Arial,sans-serif}.account-form button{padding:9px 12px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:6px;cursor:pointer}.account-form button.primary{background:var(--blue);color:white;border-color:var(--blue)}.account-note{font-size:11px;color:var(--muted);margin:8px 0 0;min-height:14px}.account-email{font-weight:600;color:var(--ink)}.footer{margin-top:12px;min-height:16px;color:var(--muted);font-size:11px}@media(max-width:620px){.account-form{grid-template-columns:1fr 1fr}.account-form label:first-child,.account-form label:nth-child(2){grid-column:1/-1}.wrap{margin:12px auto;padding:0 10px 28px}.panel{padding:13px}.key{min-height:46px;font-size:15px}.screen{font-size:25px}.graph-controls #graphExpr{width:150px}.graphbox canvas{height:240px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js" defer></script>
</head>
<body><main class="wrap">
<header class="top"><h1>Calculator</h1><span class="status" id="syncStatus" aria-live="polite">Ready</span></header>
<details class="account" id="accountPanel"><summary>Save across devices with an account</summary><form class="account-form" id="accountForm"><label>Email<input id="accountEmail" type="email" autocomplete="username" required></label><label>Password<input id="accountPassword" type="password" autocomplete="current-password" minlength="6" required></label><button class="primary" id="signInButton" type="submit">Sign in</button><button id="signUpButton" type="button">Create account</button></form><p class="account-note" id="accountNote" aria-live="polite">Sign in to sync your calculations on other devices.</p></details>
<nav class="modes" aria-label="Calculator mode"><button class="active" data-mode="regular">Regular</button><button data-mode="scientific">Scientific</button><button data-mode="graphing">Graphing</button></nav>
<section class="panel" aria-label="Calculator"><input class="screen" id="screen" aria-label="Expression" autocomplete="off" inputmode="decimal" placeholder="0"><div class="result" id="result" aria-live="polite"></div><div class="keys" id="keys"></div>
<div class="graphbox" id="graphbox"><div class="graph-controls"><label>y = <input id="graphExpr" value="sin(x)" aria-label="Graph expression"></label><button class="small" id="plot" type="button">Plot</button><span class="hint">x range</span><input id="xmin" value="-10" aria-label="Minimum x"><input id="xmax" value="10" aria-label="Maximum x"></div><canvas id="plotCanvas" width="1000" height="290" aria-label="Function graph"></canvas><p class="hint">Trigonometric functions use radians. Use <code>x</code> in the expression.</p></div>
<div class="history"><h2>Recent calculations</h2><div class="history-list" id="history"></div></div></section>
<footer class="footer" id="saveStatus"> </footer></main></body></html>

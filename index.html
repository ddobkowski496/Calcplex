<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f7bff">
<title>Calculator</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{font-family:'Fredoka',system-ui,sans-serif;--ink:#10213f;--blue:#2f7bff;--soft:#dbe8ff;--body:#0e2250;--key:#1c3a7d;--key2:#2a4f9f;color:var(--ink);background:var(--blue)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,#3b86ff,#1f5ce0);background-attachment:fixed;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.top h1{font-size:30px;font-weight:600;margin:0;color:#fff}
.status{color:#fff;opacity:.85;font-size:13px}
.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.modes button,.modebar>button{font:inherit;font-weight:500;border:0;background:#fff;color:var(--ink);border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.modes button.active,.modebar>button.active{background:var(--ink);color:#fff}
.account{margin:0 0 12px;padding:14px 18px;background:#fff;border-radius:24px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.account summary{cursor:pointer;font-weight:500}
.account-form{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end;margin-top:12px}
.account-form label{display:grid;gap:5px;color:#777;font-size:12px}
.account-form input{min-width:0;padding:11px 14px;border:2px solid #f1f1f6;background:#f1f1f6;border-radius:999px;font:inherit;outline:none}
.account-form input:focus{border-color:var(--blue)}
.account-form button{font:inherit;font-weight:500;padding:11px 18px;border:0;background:#f1f1f6;color:var(--ink);border-radius:999px;cursor:pointer}
.account-form button.primary{background:var(--blue);color:#fff}
.account-note{font-size:12px;color:#777;margin:8px 4px 0;min-height:14px}
.account-email{font-weight:600}
.panel{background:var(--body);border-radius:36px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.screen{width:100%;font:500 30px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;padding:16px 18px;border:0;border-radius:20px;color:#0b1a38;background:#dfeaff;outline:none;box-shadow:inset 0 3px 8px rgba(0,0,0,.18)}
.screen:focus{box-shadow:inset 0 3px 8px rgba(0,0,0,.18),0 0 0 3px var(--blue)}
.result{min-height:31px;margin:10px 8px 14px;text-align:right;color:#c9d8ff;font:18px ui-monospace,monospace;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.key{font:inherit;font-size:18px;font-weight:500;min-height:54px;border:0;border-radius:18px;background:var(--key);color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.key.fn{background:var(--key2)}
.key.op{background:var(--soft);color:var(--ink)}
.key.eq{background:#4d94ff;color:#fff;font-weight:600}
.graphbox{display:none;margin-top:16px}.graphbox.show{display:block}
.graph-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.graph-controls label{font-size:14px;color:#fff}
.graph-controls input{width:90px;padding:10px 14px;border:0;border-radius:999px;background:#f1f1f6;font:inherit;outline:none;text-align:center}
.graph-controls #graphExpr{width:200px;text-align:left}
.small{font:inherit;font-weight:600;border:0;background:var(--blue);color:#fff;padding:10px 20px;border-radius:999px;cursor:pointer}
.graphbox canvas{display:block;width:100%;height:290px;border-radius:22px;background:#fff}
.hint{color:#c9d8ff;font-size:13px}
.graphbox>.hint{display:none}
.history{margin-top:16px;padding-top:12px;border-top:2px solid rgba(255,255,255,.1)}
.history h2{font-size:14px;font-weight:500;margin:0 0 8px;color:#fff}
.history-list{display:grid;gap:4px;max-height:130px;overflow:auto}
.history-row{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;color:#c9d8ff;font:13px ui-monospace,monospace;cursor:pointer;border-radius:12px}
.history-row:hover{background:rgba(255,255,255,.08);color:#fff}
.footer{margin-top:12px;min-height:16px;color:#fff;opacity:.85;font-size:12px}
#desmosPane{display:none}
#desmosPane iframe{width:100%;height:min(74vh,640px);border:0;border-radius:32px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.2)}
@media(max-width:620px){.account-form{grid-template-columns:1fr 1fr}.account-form label:nth-child(-n+2){grid-column:1/-1}.panel{padding:14px;border-radius:28px}.key{min-height:46px;font-size:16px}.screen{font-size:25px}.graph-controls #graphExpr{width:100%}.graphbox canvas{height:240px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js" defer></script>
</head>
<body><main class="wrap">
<header class="top"><h1>Calculator</h1><span class="status" id="syncStatus" aria-live="polite">Ready</span></header>
<details class="account" id="accountPanel"><summary>Account</summary><form class="account-form" id="accountForm"><label>Email<input id="accountEmail" type="email" autocomplete="username" required></label><label>Password<input id="accountPassword" type="password" autocomplete="current-password" minlength="6" required></label><button class="primary" id="signInButton" type="submit">Sign in</button><button id="signUpButton" type="button">Create account</button></form><p class="account-note" id="accountNote" aria-live="polite">Sign in to sync your calculations on other devices.</p></details>
<div class="modebar">
<nav class="modes" id="modeNav" aria-label="Calculator mode"><button class="active" data-mode="regular">Regular</button><button data-mode="scientific">Scientific</button><button data-mode="graphing">Graphing</button></nav>
<button id="desmosBtn" type="button">Desmos</button>
</div>
<section class="panel" id="calcPanel" aria-label="Calculator"><input class="screen" id="screen" aria-label="Expression" autocomplete="off" inputmode="decimal" placeholder="0"><div class="result" id="result" aria-live="polite"></div><div class="keys" id="keys"></div>
<div class="graphbox" id="graphbox"><div class="graph-controls"><label>y = <input id="graphExpr" value="sin(x)" aria-label="Graph expression"></label><button class="small" id="plot" type="button">Plot</button><span class="hint">x range</span><input id="xmin" value="-10" aria-label="Minimum x"><input id="xmax" value="10" aria-label="Maximum x"></div><canvas id="plotCanvas" width="1000" height="290" aria-label="Function graph"></canvas><p class="hint">Trigonometric functions use radians. Use <code>x</code> in the expression.</p></div>
<div class="history"><h2>Recent</h2><div class="history-list" id="history"></div></div></section>
<section id="desmosPane" aria-label="Desmos"></section>
<footer class="footer" id="saveStatus"> </footer></main>
<script>
(function(){
  const nav=document.getElementById('modeNav'),panel=document.getElementById('calcPanel'),
        dp=document.getElementById('desmosPane'),db=document.getElementById('desmosBtn');
  db.addEventListener('click',()=>{
    panel.style.display='none';dp.style.display='block';db.classList.add('active');
    nav.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    if(!dp.firstChild)dp.innerHTML='<iframe src="https://www.desmos.com/calculator" title="Desmos"></iframe>';
  });
  nav.addEventListener('click',e=>{
    const b=e.target.closest('button');
    panel.style.display='';dp.style.display='none';db.classList.remove('active');
    if(b)b.classList.add('active');
  });
})();
</script>
</body></html>

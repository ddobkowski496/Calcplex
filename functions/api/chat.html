<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#ff6b9a;--panel:#fff;--ink:#2b2b3a;--soft:#f4f4f8;--me:#2b2b3a;--accent:#ff6b9a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center;padding:16px}
  .app{width:100%;max-width:760px;height:min(92vh,820px);background:var(--panel);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.15)}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:2px solid var(--soft)}
  h1{font-size:22px;margin:0;font-weight:600}
  .back{font:inherit;font-weight:500;border:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer;text-decoration:none}
  .back:hover{background:#44445a}
  #log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:12px 16px;border-radius:20px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .bot{background:var(--soft);align-self:flex-start;border-bottom-left-radius:6px}
  .me{background:var(--me);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
  form{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--soft)}
  input{flex:1;font:inherit;border:2px solid var(--soft);background:var(--soft);border-radius:999px;padding:12px 18px;outline:none;color:var(--ink)}
  input:focus{border-color:var(--accent)}
  button.send{font:inherit;font-weight:600;border:0;background:var(--accent);color:#fff;padding:0 24px;border-radius:999px;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Assistant</h1>
    <a class="back" href="/">Calculator</a>
  </header>
  <div id="log"><div class="msg bot">Hi! Ask me anything.</div></div>
  <form id="f">
    <input id="q" autocomplete="off" placeholder="Type a message" aria-label="Message">
    <button class="send" id="go">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById('log'), f = document.getElementById('f'),
        q = document.getElementById('q'), go = document.getElementById('go');
  const history = [];
  function add(text, who){
    const d = document.createElement('div');
    d.className = 'msg ' + who; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const text = q.value.trim(); if(!text) return;
    q.value = ''; go.disabled = true;
    add(text, 'me'); history.push({role:'user', content:text});
    const typing = add('...', 'bot');
    try{
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages:history})});
      const data = await r.json();
      typing.textContent = data.reply;
      history.push({role:'assistant', content:data.reply});
    }catch(err){
      typing.textContent = 'Could not reach the assistant. Check your connection.';
    }
    go.disabled = false; q.focus();
  });
</script>
</body>
</html>
